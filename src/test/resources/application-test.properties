# Perfil de pruebas: base de datos en memoria, sin dependencia de Supabase.
spring.datasource.url=jdbc:h2:mem:fiscore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway queda fuera de las pruebas: las migraciones están escritas en DDL de
# PostgreSQL y aquí la base es H2. El esquema lo levanta Hibernate con
# create-drop, que además deja cada ejecución limpia.
spring.flyway.enabled=false

authentication.enabled=false
spring.thymeleaf.cache=false

logging.level.org.hibernate.SQL=WARN

# Necesario para poder contar consultas en las pruebas de rendimiento
spring.jpa.properties.hibernate.generate_statistics=true
