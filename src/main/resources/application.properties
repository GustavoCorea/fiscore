# ============================================================
# Fiscore — Configuración base
# Los valores tras ':' son los de desarrollo local. En producción
# todo se inyecta por variables de entorno; aquí no va ningún secreto.
# ============================================================
spring.application.name=fiscore

# ── Servidor ────────────────────────────────────────────────
# PORT lo inyecta Render automáticamente
server.port=${PORT:8080}
# En Render se usa '/'; en local se mantiene '/fiscore'
server.servlet.context-path=${CONTEXT_PATH:/fiscore}
# Confiar en las cabeceras X-Forwarded-* del proxy de Render, para que
# Spring sepa que la petición original llegó por HTTPS (cookies Secure).
server.forward-headers-strategy=NATIVE
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

# ── Seguridad ───────────────────────────────────────────────
authentication.enabled=${AUTH_ENABLED:true}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}

# USUARIO ADMINISTRADOR INICIAL
# Solo se crea si la tabla ADM_USUARIOS está vacía; nunca pisa usuarios
# existentes. Definir SEED_ADMIN_PASS antes del primer despliegue.
fiscore.seguridad.usuario-inicial.habilitado=${SEED_ADMIN:true}
fiscore.seguridad.usuario-inicial.username=${SEED_ADMIN_USER:admin}
fiscore.seguridad.usuario-inicial.password=${SEED_ADMIN_PASS:Fiscore2026*}
fiscore.seguridad.usuario-inicial.correo=${SEED_ADMIN_MAIL:admin@fiscore.sv}

# ── Base de datos ───────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contasuite}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP. Los valores por defecto sirven para una BD local siempre
# encendida; el perfil 'prod' los reajusta para Neon (serverless).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:120000}
# max-lifetime debe superar idle-timeout; con 30s Hikari reciclaba conexiones en uso
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:300000}
# Una BD serverless puede haber cerrado la conexión mientras dormía:
# validarla antes de entregarla evita errores intermitentes.
spring.datasource.hikari.validation-timeout=5000

# ── JPA / Hibernate ─────────────────────────────────────────
# 'update' crea y amplía el esquema solo (nunca borra). Ver DEPLOY.md §6
# para el paso a migraciones versionadas.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# El dialecto no se declara: Hibernate 6 lo deduce de la conexión y fijarlo
# a mano provoca el aviso de deprecación HHH90000025.
spring.jpa.properties.hibernate.jdbc.time_zone=America/El_Salvador
# Las vistas no deben disparar consultas: todo lo que la pantalla necesita
# se carga en el controlador.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Procesamiento en lote
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ── Vistas ──────────────────────────────────────────────────
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ── Errores: nunca exponer trazas al usuario ────────────────
# El valor por defecto ya es seguro aunque se olvide activar el perfil 'prod'.
server.error.include-stacktrace=${ERROR_STACKTRACE:never}
server.error.include-message=${ERROR_MESSAGE:never}

# ── Registro ────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.fiscore=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate.SQL=WARN
# Oculta las trazas de metadatos JDBC "unknown" al usar un pooler externo
logging.level.org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator=WARN

# ── Locale / formatos ───────────────────────────────────────
spring.web.locale=es_SV
spring.web.locale-resolver=fixed
spring.jackson.time-zone=America/El_Salvador
