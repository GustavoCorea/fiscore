<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/layout :: head}"></head>
<body>
<div class="wrapper">
    <header th:replace="~{layout/header :: header}"></header>
    <aside th:replace="~{layout/menu :: aside}"></aside>

    <div class="content-page">
        <div class="content">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="card shadow-sm mt-5">
                            <div class="card-body text-center p-5">
                                <i class="mdi mdi-alert-circle-outline text-danger" style="font-size:4rem;"></i>
                                <h1 class="fw-bold mt-3 mb-1" th:text="${status} ?: 'Error'">500</h1>
                                <h4 class="text-muted fw-normal mb-3">Algo no salió como esperábamos</h4>
                                <p class="text-muted"
                                   th:text="${mensaje} ?: 'Ocurrió un error inesperado al procesar la solicitud.'">
                                    Ocurrió un error inesperado.
                                </p>
                                <div class="button-list mt-4">
                                    <a th:href="@{/inicio}" class="btn btn-primary">
                                        <i class="mdi mdi-home me-1"></i> Ir al panel
                                    </a>
                                    <a href="javascript:history.back();" class="btn btn-outline-secondary">
                                        <i class="mdi mdi-arrow-left me-1"></i> Volver
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
