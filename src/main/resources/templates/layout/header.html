<header id="header" th:header="header">
    <!-- ========== Topbar Start ========== -->
    <div class="navbar-custom sticky-top" style="z-index: 1001;">
        <div class="topbar container-fluid">
            <div class="d-flex align-items-center gap-lg-2 gap-1">

                <!-- Marca de la barra superior -->
                <div class="logo-topbar">
                    <!-- Sobre barra oscura -->
                    <a th:href="@{/inicio}" class="logo-light">
                        <span class="logo-lg">
                            <span class="fs-logo fs-logo-sm">
                                <img class="fs-logo-mark" th:src="@{/assets/images/fiscore-mark.svg}" alt="">
                                <span class="fs-logo-text">Fiscore</span>
                            </span>
                        </span>
                        <span class="logo-sm">
                            <img class="fs-logo-mark" th:src="@{/assets/images/fiscore-mark.svg}" alt="Fiscore">
                        </span>
                    </a>
                    <!-- Sobre barra clara -->
                    <a th:href="@{/inicio}" class="logo-dark">
                        <span class="logo-lg">
                            <span class="fs-logo fs-logo-sm">
                                <img class="fs-logo-mark" th:src="@{/assets/images/fiscore-mark.svg}" alt="">
                                <span class="fs-logo-text">Fiscore</span>
                            </span>
                        </span>
                        <span class="logo-sm">
                            <img class="fs-logo-mark" th:src="@{/assets/images/fiscore-mark.svg}" alt="Fiscore">
                        </span>
                    </a>
                </div>
                <!-- Sidebar Menu Toggle Button -->
                <button class="button-toggle-menu">
                    <i class="mdi mdi-menu"></i>
                </button>
                <!-- Horizontal Menu Toggle Button -->
                <button class="navbar-toggle" data-bs-toggle="collapse" data-bs-target="#topnav-menu-content">
                    <div class="lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>
                <!-- Topbar Search Form -->
                <div class="app-search dropdown d-none d-lg-block">
                </div>
            </div>

            <ul class="topbar-menu d-flex align-items-center gap-3">
                <li class="dropdown d-lg-none">
                    <a class="nav-link dropdown-toggle arrow-none" data-bs-toggle="dropdown" href="#" role="button"
                       aria-haspopup="false" aria-expanded="false">
                        <i class="ri-search-line font-22"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-animated dropdown-lg p-0">
                        <form class="p-3">
                            <input type="search" class="form-control" placeholder="Search ..."
                                   aria-label="Recipient's username">
                        </form>
                    </div>
                </li>
                <li class="dropdown notification-list">
                    <a class="nav-link dropdown-toggle arrow-none" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="false" aria-expanded="false">
                        <i class="ri-notification-3-line font-22"></i>
                        <span class="noti-icon-badge" th:if="${totalAvisos != null and totalAvisos > 0}"></span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end dropdown-menu-animated dropdown-lg py-0">
                        <div class="p-2 border-top-0 border-start-0 border-end-0 border-dashed border">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h6 class="m-0 font-16 fw-semibold">Pendientes</h6>
                                </div>
                                <div class="col-auto">
                                    <span class="badge bg-danger" th:if="${totalAvisos != null and totalAvisos > 0}"
                                          th:text="${totalAvisos}">0</span>
                                </div>
                            </div>
                        </div>

                        <div class="px-2" style="max-height: 300px;" data-simplebar>
                            <a th:each="aviso : ${avisos}" th:href="@{${aviso.enlace}}"
                               class="dropdown-item p-0 notify-item card unread-noti shadow-none mb-2 mt-2">
                                <div class="card-body">
                                    <div class="d-flex align-items-center">
                                        <div class="flex-shrink-0">
                                            <div class="notify-icon" th:classappend="'bg-' + ${aviso.color}">
                                                <i class="mdi" th:classappend="${aviso.icono}"></i>
                                            </div>
                                        </div>
                                        <div class="flex-grow-1 text-truncate ms-2">
                                            <h5 class="noti-item-title fw-semibold font-14" th:text="${aviso.titulo}"></h5>
                                            <small class="noti-item-subtitle text-muted" th:text="${aviso.detalle}"></small>
                                        </div>
                                    </div>
                                </div>
                            </a>

                            <div class="text-center text-muted py-4"
                                 th:if="${avisos == null or #lists.isEmpty(avisos)}">
                                <i class="mdi mdi-check-circle-outline text-success font-24 d-block mb-1"></i>
                                <small>Todo al día</small>
                            </div>
                        </div>

                        <a th:href="@{/inicio}" class="dropdown-item text-center text-primary notify-item border-top border-light py-2">
                            Ir al panel de control
                        </a>

                    </div>
                </li>

                <li class="d-none d-sm-inline-block">
                    <div class="nav-link" id="light-dark-mode" data-bs-toggle="tooltip" data-bs-placement="left"
                         title="Theme Mode">
                        <i class="ri-moon-line font-22"></i>
                    </div>
                </li>
                <li class="d-none d-md-inline-block">
                    <a class="nav-link" href="" data-toggle="fullscreen">
                        <i class="ri-fullscreen-line font-22"></i>
                    </a>
                </li>
                <li class="dropdown">
                    <a class="nav-link dropdown-toggle arrow-none nav-user px-2" data-bs-toggle="dropdown" href="#"
                       role="button" aria-haspopup="false" aria-expanded="false">
                        <!--<span class="account-user-avatar">
                            <img src="assets/images/users/avatar-1.jpg" alt="user-image" width="32"
                                class="rounded-circle">
                        </span>-->
                        <span class="d-lg-flex flex-column gap-1 d-none">
							<h5 class="my-0">[[${username}]]</h5>
							<!--h6 class="my-0 fw-normal" th:text="${session.roles != null ? session.roles : 'Sin Rol'}"></h6-->
						</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end dropdown-menu-animated profile-dropdown">
                        <!-- item-->
                        <div class=" dropdown-header noti-title">
                            <h6 class="text-overflow m-0">¡Bienvenido!</h6>
                        </div>

                        <a th:href="@{/clientes}" class="dropdown-item">
                            <i class="mdi mdi-account-multiple me-1"></i>
                            <span>Clientes</span>
                        </a>

                        <a th:href="@{/reportes}" class="dropdown-item">
                            <i class="mdi mdi-chart-bar me-1"></i>
                            <span>Reportes</span>
                        </a>

                        <div class="dropdown-divider"></div>

                        <!-- item-->
                        <a th:href="@{/logout}" class="dropdown-item">
                            <i class="mdi mdi-logout me-1"></i>
                            <span>Cerrar sesión</span>
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <!-- ========== Topbar End ========== -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="theme-settings-offcanvas">
        <div class="d-flex align-items-center bg-primary p-3 offcanvas-header">
            <h5 class="text-white m-0">Theme Settings</h5>
            <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div data-simplebar class="h-100">
                <div class="card mb-0 p-3">
                    <h5 class="mt-0 font-16 fw-bold mb-3">Choose Layout</h5>
                </div>
            </div>
        </div>
        <div class="offcanvas-footer border-top p-3 text-center">
            <div class="row">
                <div class="col-6">
                    <button type="button" class="btn btn-light w-100" id="reset-layout">Reset</button>
                </div>
            </div>
        </div>
    </div>
</header>
