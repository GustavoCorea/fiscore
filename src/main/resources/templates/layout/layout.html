<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-layout-mode="detached" data-topbar-color="dark" data-menu-color="light" data-sidenav-user="true">

<head th:fragment="head">
    <meta charset="utf-8">
    <title th:text="${pageTitle != null ? 'Fiscore · ' + pageTitle : 'Fiscore'}">Fiscore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Context path disponible para todo el JS de la aplicación -->
    <script th:inline="javascript">
        window.CTX = /*[[@{/}]]*/ '/';
        /** Construye una URL absoluta respetando el context-path. */
        window.url = function (path) {
            return window.CTX.replace(/\/$/, '') + (path.startsWith('/') ? path : '/' + path);
        };
    </script>
    <!-- Con la seguridad activada, Spring exige el token CSRF en toda petición
         que modifique datos. Se envuelve fetch() una sola vez aquí para que
         ningún POST/PUT/PATCH/DELETE de las pantallas tenga que recordarlo. -->
    <script th:inline="none">
        (function () {
            const SEGUROS = ['GET', 'HEAD', 'OPTIONS', 'TRACE'];

            function leerCookie(nombre) {
                return document.cookie.split('; ')
                    .filter(c => c.startsWith(nombre + '='))
                    .map(c => decodeURIComponent(c.substring(nombre.length + 1)))[0];
            }

            const fetchOriginal = window.fetch;
            window.fetch = function (recurso, opciones) {
                opciones = opciones || {};
                const metodo = (opciones.method || 'GET').toUpperCase();

                if (!SEGUROS.includes(metodo)) {
                    const token = leerCookie('XSRF-TOKEN');
                    if (token) {
                        const cabeceras = new Headers(opciones.headers || {});
                        if (!cabeceras.has('X-XSRF-TOKEN')) cabeceras.set('X-XSRF-TOKEN', token);
                        opciones = Object.assign({}, opciones, { headers: cabeceras });
                    }
                    // Necesario para que la cookie de sesión viaje en la petición
                    if (!opciones.credentials) opciones.credentials = 'same-origin';
                }

                return fetchOriginal.call(this, recurso, opciones).then(function (respuesta) {
                    // Si la sesión caducó, Spring responde con el HTML del login:
                    // se detecta y se redirige en lugar de fallar al parsear JSON.
                    if (respuesta.redirected && respuesta.url.includes('/login')) {
                        window.location.href = respuesta.url;
                    }
                    return respuesta;
                });
            };
        })();
    </script>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">

    <link th:href="@{/assets/vendor/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css}" rel="stylesheet" type="text/css" />

    <link th:href="@{/assets/vendor/datatables.net-fixedheader-bs5/css/fixedHeader.bootstrap5.min.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/assets/vendor/datatables.net-buttons-bs5/css/buttons.bootstrap5.min.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/assets/vendor/datatables.net-select-bs5/css/select.bootstrap5.min.css}" rel="stylesheet" type="text/css" />
    <!-- Theme Config Js -->
    <script th:src="@{/assets/js/hyper-config.js}"></script>
    <!-- App css -->
    <link th:href="@{/assets/css/app-modern.min.css}" rel="stylesheet" type="text/css" id="app-style" />
    <!-- Icons css -->
    <link th:href="@{/assets/css/icons.min.css}" rel="stylesheet" type="text/css" />
