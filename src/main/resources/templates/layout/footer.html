<!-- ======= Footer ======= -->
<footer id="footer" th:footer="footer" class="footer footerIndex">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <div class="text-md-end footer-links d-none d-md-block">

                </div>
            </div>
            <div class="col-md-6">
                &copy; Copyright <strong><span>OutsoDev 2026</span></strong>
            </div>
        </div>
    </div>
    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
    <!-- Vendor js -->
    <script th:src="@{/assets/js/vendor.min.js}"></script>

    <!-- Apex Charts js -->
    <script th:src="@{/assets/vendor/apexcharts/apexcharts.min.js}"></script>
    <!-- sweetalert2@11 -->
    <script th:src="@{/assets/js/sweetalert2.11.js}"></script>

    <!-- NO añadir aquí librerías "por si acaso": este footer se carga en TODAS las
         pantallas, así que cada script cuenta en cada visita. Se retiraron por no
         usarlas en ningún sitio (~1 MB por carga, medido):
           · highlight.js + clipboard + hyper-syntax  (732 KB) resaltado de código
           · jsvectormap + los dos mapas del mundo    (233 KB)
           · daterangepicker + moment                 (118 KB)
         El bloque de app.js que usa daterangepicker está protegido por
         'if (jQuery().daterangepicker)', de modo que sin la librería no se ejecuta
         y moment() nunca llega a invocarse. -->

    <!-- Datatables js -->
    <script th:src="@{/assets/vendor/datatables.net/js/jquery.dataTables.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-bs5/js/dataTables.bootstrap5.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-responsive/js/dataTables.responsive.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-responsive-bs5/js/responsive.bootstrap5.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-fixedcolumns-bs5/js/fixedColumns.bootstrap5.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-fixedheader/js/dataTables.fixedHeader.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-buttons/js/dataTables.buttons.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-buttons-bs5/js/buttons.bootstrap5.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-buttons/js/buttons.html5.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-buttons/js/buttons.flash.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-buttons/js/buttons.print.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-keytable/js/dataTables.keyTable.min.js}"></script>
    <script th:src="@{/assets/vendor/datatables.net-select/js/dataTables.select.min.js}"></script>

    <!-- Valores por defecto de DataTables, en un único sitio.
         'lengthMenu' incluye el 15 porque las pantallas piden pageLength: 15, y
         DataTables pinta el desplegable "Mostrar __ registros" VACÍO cuando el
         tamaño de página no figura entre las opciones del menú. -->
    <script th:inline="none">
        $.extend(true, $.fn.dataTable.defaults, {
            lengthMenu: [10, 15, 25, 50, 100]
        });
    </script>

    <!-- Input Mask js -->
    <script th:src="@{/assets/vendor/jquery-mask-plugin/jquery.mask.min.js}"></script>
    <script th:src="@{/assets/vendor/jquery-toast-plugin/jquery.toast.min.js}"></script>
    <!-- App js -->
    <script th:src="@{/assets/js/app.min.js}"></script>
    <script th:src="@{https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.6/jquery.inputmask.min.js}"></script>

    <script>
        $(document).ready(function(){
            // Cuando se haga clic en el botón back-to-top
            $('.back-to-top').click(function(){
                // Desplazarse suavemente hacia arriba
                $('html, body').animate({scrollTop : 0},400);
                return false;
            });
        });
    </script>

</footer><!-- End Footer -->
