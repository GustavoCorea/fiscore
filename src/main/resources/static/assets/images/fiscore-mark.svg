<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Fiscore">
  <title>Fiscore</title>
  <defs>
    <linearGradient id="fsBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a83f7"/>
      <stop offset="100%" stop-color="#5566e5"/>
    </linearGradient>
  </defs>

  <!-- Placa -->
  <rect width="40" height="40" rx="10" fill="url(#fsBadge)"/>

  <!-- Letra F: asta y dos brazos, dibujados como barras de un libro contable -->
  <g fill="#ffffff">
    <rect x="9"  y="9"  width="4"  height="22" rx="1.6"/>
    <rect x="9"  y="9"  width="13" height="4"  rx="1.6"/>
    <rect x="9"  y="17" width="9"  height="4"  rx="1.6"/>
  </g>

  <!-- Barras ascendentes: el resultado que el despacho controla -->
  <g fill="#0acf97">
    <rect x="24.2" y="24" width="3.4" height="7"  rx="1.2"/>
    <rect x="29.2" y="19" width="3.4" height="12" rx="1.2"/>
  </g>
</svg>
