# ============================================================
# Fiscore — Perfil PRODUCCIÓN
# Activar con SPRING_PROFILES_ACTIVE=prod (el Dockerfile ya lo fija).
# Se aplica encima de application.properties.
# ============================================================

# ── Servidor ─────────────────────────────────────────────────
# En Render la aplicación cuelga de la raíz del dominio. El valor debe ser
# CADENA VACÍA: Spring rechaza "/" con "ContextPath must start with '/' and
# not end with '/'" y el contenedor no llega a arrancar.
server.servlet.context-path=${CONTEXT_PATH:}

# ── Vistas ───────────────────────────────────────────────────
spring.thymeleaf.cache=true

# ── Registro ─────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.fiscore=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ── Errores: no filtrar nada del interior ────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ── HikariCP ajustado a Neon (free tier) ─────────────────────
# Neon suspende el compute tras unos 5 min sin actividad. Mantener
# conexiones abiertas lo impediría y consumiría las horas gratuitas,
# así que el pool se deja drenar por completo:
#   minimum-idle=0      -> ninguna conexión permanente
#   idle-timeout=60s    -> las ociosas se cierran pronto
#   max-lifetime=10min  -> recicla antes de que Neon las corte
# El precio es 1-3 s de espera en la primera consulta tras un periodo
# inactivo, mientras Neon despierta.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:600000}
# Margen amplio: incluye el arranque del compute serverless
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
# Reintentos por si Neon aún está despertando cuando arranca el contenedor
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT:60000}

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.show-sql=false

# ── Cookies tras el TLS de Render ────────────────────────────
# forward-headers-strategy=NATIVE hace que Spring reconozca la petición
# como segura y marque también la cookie XSRF-TOKEN con Secure.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
